services:
  # ─── PostgreSQL 16 + PostGIS 3.4 ─────────────────────────────────────────
  postgres:
    image: postgis/postgis:16-3.4
    container_name: egpp_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: egpp_db
      POSTGRES_USER: egpp_user
      POSTGRES_PASSWORD: egpp_pass
    ports:
      - "5432:5432"
    volumes:
      - egpp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U egpp_user -d egpp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis 7 ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: egpp_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass egpp_redis_pass
    ports:
      - "6379:6379"
    volumes:
      - egpp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "egpp_redis_pass", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Python FastAPI AI Microservice ───────────────────────────────────────
  ai_service:
    build:
      context: ./ai_service
      dockerfile: Dockerfile
    container_name: egpp_ai
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HF_HOME=/app/.cache/huggingface
      - TRANSFORMERS_CACHE=/app/.cache/huggingface/hub
    volumes:
      # Persist HuggingFace model weights across container restarts
      - egpp_hf_cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      start_period: 120s   # Allow 2min for model download on first boot
      retries: 3

  # ─── Node.js Express Backend ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: egpp_backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NODE_ENV=production
      - AI_SERVICE_URL=http://ai_service:8000
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ai_service:
        condition: service_healthy

  # ─── Nginx Reverse Proxy ──────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: egpp_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - ai_service

volumes:
  egpp_postgres_data:
    driver: local
  egpp_redis_data:
    driver: local
  egpp_hf_cache:
    driver: local
